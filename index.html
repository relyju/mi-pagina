<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .contenedor {
            margin-top: 100px;
            background: white;
            width: 350px;
            margin-left: auto;
            margin-right: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>Mi página</h1>
        <p>Bienvenido a mi sitio web.</p>
    </div>

</body>
</html>
